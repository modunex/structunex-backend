# Render Blueprint de Structunex: base de datos + API + calc-service + frontend.
# Render → New → Blueprint → elegir este repo. Las variables con `sync: false` se
# piden en el panel al crear el Blueprint y no se guardan en git.
#
# ANTES DE USARLO: el frontend y el calc-service tienen que estar en GitHub (hoy solo
# tienen remoto de Heroku). Ajusta sus `repo:` abajo.

databases:
  - name: structunex-db
    databaseName: structunex
    plan: basic-256mb # el plan free caduca a los 30 días
    ipAllowList: [] # solo red privada; añade tu IP para conectarte desde fuera

services:
  # ─── API (este repo) ───
  - type: web
    name: structunex-backend
    runtime: node
    repo: https://github.com/Fmelendre/structunex-backend
    branch: main
    plan: starter # sin spin-down: un análisis en curso no se corta
    buildCommand: npm ci # postinstall ejecuta `prisma generate`
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: structunex-db
          property: connectionString # URL interna
      - key: CALC_SERVICE_HOSTPORT
        fromService:
          type: pserv
          name: structunex-calc
          property: hostport
      - key: CLIENT_ORIGIN
        value: https://app.structunex.com
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SIGNING_SECRET
        sync: false
      - key: MAILCHIMP_API_KEY
        sync: false
      - key: MAILCHIMP_AUDIENCE_ID
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID # Get/Delete/List sobre el bucket
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false

  # ─── calc-service (MYSTRAN, Docker), solo accesible desde la red privada ───
  - type: pserv
    name: structunex-calc
    runtime: docker
    repo: https://github.com/Fmelendre/structunex-calc-service # TODO: confirmar
    branch: main
    plan: starter # MYSTRAN necesita RAM: sube de plan si los modelos grandes fallan
    dockerfilePath: ./Dockerfile
    envVars:
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID # solo PutObject
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET # respaldo: el backend manda el bucket en cada petición
        sync: false

  # ─── Frontend (Vite, estático) ───
  - type: web
    name: structunex-frontend
    runtime: static
    repo: https://github.com/Fmelendre/structunex-frontend # TODO: confirmar
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://api.structunex.com/api
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
